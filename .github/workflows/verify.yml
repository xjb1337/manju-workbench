name: Verify
# 本地交付仅静态核对本配置。GitHub Actions 和 Windows 真机均未执行。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git ffmpeg fonts-noto-cjk
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-windows-update.cjs

  windows-update-fixtures:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:update
